name: Build Cheems Browser V0.2 Gecko + SearXNG

on:
  push:
    branches: [main]
    paths:
      - "browser-v02/**"
      - ".github/workflows/build-v02.yml"
      - "CheemsGeckoBrowser_V0.1_Source.zip"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore GeckoView project
        run: unzip -q CheemsGeckoBrowser_V0.1_Source.zip -d source

      - name: Integrate Cheems Search V0.2
        shell: bash
        run: |
          set -euo pipefail
          ROOT=source/CheemsGeckoBrowser
          cd "$ROOT"
          patch --batch -p1 < ../../browser-v02/MainActivity.patch
          cp ../../browser-v02/CheemsSearchOverlay.kt app/src/main/java/io/cheems/browser/
          sed -i 's/progressBackgroundTintList = Color.rgb(8, 13, 28)/progressBackgroundTintList = ColorStateList.valueOf(Color.rgb(8, 13, 28))/' app/src/main/java/io/cheems/browser/MainActivity.kt
          grep -Fq 'progressBackgroundTintList = ColorStateList.valueOf' app/src/main/java/io/cheems/browser/MainActivity.kt
          sed -i 's/versionCode = 1/versionCode = 2/' app/build.gradle.kts
          sed -i 's/versionName = "0.1.0"/versionName = "0.2.0"/' app/build.gradle.kts
          sed -i 's/version "8.10.0"/version "9.1.1"/' build.gradle.kts
          sed -i 's/version "2.2.20"/version "2.4.20"/' build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 37/' app/build.gradle.kts
          sed -i '/kotlinOptions { jvmTarget = "17" }/d' app/build.gradle.kts
          printf '\nkotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }\n' >> app/build.gradle.kts
          printf '\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' >> gradle.properties
          grep -Fq 'DEFAULT_SEARCH = "https://searx.tiekoetter.com"' app/src/main/java/io/cheems/browser/MainActivity.kt
          test -s app/src/main/java/io/cheems/browser/CheemsSearchOverlay.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        uses: android-actions/setup-android@v4

      - name: Install Android API 37
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile Android APK
        run: gradle -p source/CheemsGeckoBrowser :app:assembleDebug --no-daemon

      - name: Upload Cheems Browser V0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CheemsBrowser-V0.2-Debug-APK
          path: source/CheemsGeckoBrowser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
