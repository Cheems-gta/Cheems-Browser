name: CFM PC V1.0.1 - Full Multi-select + QA + Windows EXE
on:
  push:
    branches: [cfm-pc-web-v1.0.1-fixes]
    paths:
      - "Cheems-File-Manager-PC/**"
      - "CFM-QA/**"
      - ".github/workflows/cfm-pc-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI test dependency
        run: npm install --no-save --prefix ./CFM-QA jsdom@26.1.0 playwright@1.56.1
      - name: Test real PC HTML+JS interactions in simulated browser
        run: node CFM-QA/ui-smoke.cjs pc
      - name: Test responsive layout in real Edge
        run: node CFM-QA/layout.cjs
      - name: Generate Cheems Windows icon from approved artwork
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          python -c "from PIL import Image; im=Image.open('Cheems-File-Manager-PC/branding/cfm_icon.webp').convert('RGBA'); im.save('Cheems-File-Manager-PC/branding/cfm_icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if (!(Test-Path "Cheems-File-Manager-PC/branding/cfm_icon.ico")) { throw "Icon generation failed" }
      - name: Windows filesystem integration tests
        run: dotnet run --project ./CFM-QA/CFM.QA.csproj -c Release
      - name: Publish standalone Windows x64 EXE
        shell: pwsh
        run: dotnet publish ./Cheems-File-Manager-PC/CheemsFileManagerPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./cfm-pc-output
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: CheemsFileManager-PC-V1.0.1-Full-win-x64
          path: ./cfm-pc-output/**
          if-no-files-found: error
          retention-days: 30

      - name: Package and publish tested repair preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ./repair-release | Out-Null
          Copy-Item ./cfm-pc-output/CheemsFileManagerPC.exe ./repair-release/CheemsFileManagerPC_V1.0.1_win-x64.exe
          Compress-Archive -Path ./cfm-pc-output/* -DestinationPath ./repair-release/CheemsFileManager-PC-V1.0.1-win-x64.zip
          Get-ChildItem ./repair-release -File | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name } | Set-Content ./repair-release/SHA256SUMS.txt
          gh release create cfm-pc-v1.0.1-preview ./repair-release/* --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title "Cheems File Manager PC V1.0.1 · 修复预览版" --notes-file ./CFM-QA/RELEASE-1.0.1.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
