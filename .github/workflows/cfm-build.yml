name: CFM V0.1 - Windows EXE
on:
  push:
    branches: [cfm-v0.1]
    paths:
      - "Cheems-File-Manager/**"
      - ".github/workflows/cfm-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish standalone Windows x64 EXE
        shell: pwsh
        run: dotnet publish ./Cheems-File-Manager/CheemsFileManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o ./cfm-output
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheemsFileManager-v0.1-win-x64
          path: ./cfm-output/CheemsFileManager.exe
          if-no-files-found: error
          retention-days: 30
