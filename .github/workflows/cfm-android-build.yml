name: CFM PC UI Android Preview v0.6 - Build APK
on:
  push:
    branches: [cfm-pc-android-preview-v0.6]
    paths:
      - "Cheems-File-Manager-Android/**"
      - ".github/workflows/cfm-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 via runner
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build full PC UI Android preview APK
        run: gradle -p Cheems-File-Manager-Android :app:assembleDebug --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: CheemsFM-PC-UI-Android-Preview-V0.6-APK
          path: Cheems-File-Manager-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
