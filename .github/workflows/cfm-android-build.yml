name: CFM Android V0.7 - QA + APK
on:
  push:
    branches: [cfm-pc-android-preview-v0.7]
    paths:
      - "Cheems-File-Manager-Android/**"
      - "CFM-QA/**"
      - ".github/workflows/cfm-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI test dependency
        run: npm install --no-save --prefix ./CFM-QA jsdom@26.1.0
      - name: Test Android HTML+JS interactions in simulated browser
        run: node CFM-QA/ui-smoke.cjs android
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 via runner
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble APK after UI tests
        run: gradle -p Cheems-File-Manager-Android :app:assembleDebug --stacktrace
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CheemsFM-PC-UI-Android-Preview-V0.7-QA-APK
          path: Cheems-File-Manager-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
