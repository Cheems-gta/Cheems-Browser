name: CFM Android V1.5 - Multi-select + QA APK
on:
  push:
    branches: [cfm-pc-android-preview-v1.5]
    paths:
      - "Cheems-File-Manager-Android/**"
      - "CFM-QA/**"
      - ".github/workflows/cfm-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI test dependency
        run: npm install --no-save --prefix ./CFM-QA jsdom@26.1.0
      - name: Test Android HTML+JS interactions in simulated browser
        run: node CFM-QA/ui-smoke.cjs android
      - name: Static check of mobile pane-selection handlers
        shell: bash
        run: |
          node --check Cheems-File-Manager-Android/app/src/main/assets/pcui/app.js
          if grep -F '\$(".pane").forEach' Cheems-File-Manager-Android/app/src/main/assets/pcui/app.js; then
            echo "Broken pane selector found"
            exit 1
          fi
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 via runner
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check bundled Cheems launcher artwork
        run: |
          file Cheems-File-Manager-Android/app/src/main/res/mipmap-nodpi/ic_launcher.webp
          test -s Cheems-File-Manager-Android/app/src/main/res/mipmap-nodpi/ic_launcher.webp
      - name: Assemble APK after UI tests
        run: gradle -p Cheems-File-Manager-Android :app:assembleDebug --stacktrace
      - name: Compile Android instrumented tests
        run: gradle -p Cheems-File-Manager-Android :app:assembleDebugAndroidTest --stacktrace
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CheemsFM-Android-V1.5-EasySelect-APK
          path: Cheems-File-Manager-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-runtime-qa:
    name: Test native file actions in Android emulator
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable hardware acceleration if available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run Android shared-storage integration suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            gradle -p Cheems-File-Manager-Android :app:installDebug :app:installDebugAndroidTest --stacktrace
            adb shell appops set win.cheems.filemanager.pcpreview MANAGE_EXTERNAL_STORAGE allow
            gradle -p Cheems-File-Manager-Android :app:connectedDebugAndroidTest --stacktrace

