name: Build Cheems Browser APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP"
          unzip -q "$ZIP" -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          gradle -p source/CheemsGeckoBrowser :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CheemsBrowser-APK
          path: source/CheemsGeckoBrowser/app/build/outputs/apk/debug/app-debug.apk
