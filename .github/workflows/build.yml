name: Build Cheems Browser APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q CheemsGeckoBrowser_V0.1_Source.zip -d source

      - name: Repair Gradle and Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail
          ROOT=source/CheemsGeckoBrowser
          sed -i 's/version "8.10.0"/version "9.1.1"/' "$ROOT/build.gradle.kts"
          sed -i 's/version "2.2.20"/version "2.4.20"/' "$ROOT/build.gradle.kts"
          sed -i 's/compileSdk = 35/compileSdk = 37/' "$ROOT/app/build.gradle.kts"
          sed -i '/kotlinOptions { jvmTarget = "17" }/d' "$ROOT/app/build.gradle.kts"
          printf '\nkotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }\n' >> "$ROOT/app/build.gradle.kts"
          printf '\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' >> "$ROOT/gradle.properties"
          grep -q 'version "9.1.1"' "$ROOT/build.gradle.kts"
          grep -q 'version "2.4.20"' "$ROOT/build.gradle.kts"
          grep -q 'compileSdk = 37' "$ROOT/app/build.gradle.kts"

      - name: Fix ColorStateList Kotlin type mismatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/CheemsGeckoBrowser/app/src/main/java/io/cheems/browser/MainActivity.kt")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          line_number = 177
          original = lines[line_number - 1]
          print(f"Inspecting MainActivity.kt:{line_number}: {original.rstrip()}")
          match = re.fullmatch(r"(\s*[\w.]*TintList\s*=\s*)(.*?)(\r?\n)?", original)
          if match is None:
              raise RuntimeError("Unexpected Kotlin statement at line 177; refusing unsafe rewrite")
          expression = match.group(2).strip()
          if not expression or "ColorStateList.valueOf" in expression:
              raise RuntimeError("Unexpected tint expression; refusing unsafe rewrite")
          lines[line_number - 1] = (
              match.group(1) + "android.content.res.ColorStateList.valueOf("
              + expression + ")" + (match.group(3) or "")
          )
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Integrate Cheems Search and version 0.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source/CheemsGeckoBrowser")
          activity = root / "app/src/main/java/io/cheems/browser/MainActivity.kt"
          src = activity.read_text(encoding="utf-8")
          src = src.replace(
              'private const val SEARCH_ENDPOINT = "https://www.bing.com/search?q="',
              'private const val SEARCH_ENDPOINT = "https://priv.au/search?q="'
          )
          if "https://priv.au/search?q=" not in src:
              raise RuntimeError("Cannot update old search endpoint")

          src = src.replace(
              "import android.content.Context\n",
              "import android.content.Context\nimport android.content.Intent\n"
          )

          old = "        val url = normalizeAddress(input)\n        val tab = currentTab()"
          new = """        val url = normalizeAddress(input)
                  if (url.startsWith(SEARCH_ENDPOINT) &&
                      !input.startsWith("http://", true) &&
                      !input.startsWith("https://", true)) {
                      startActivityForResult(
                          Intent(this, CheemsSearchActivity::class.java)
                              .putExtra("query", input), 729)
                      return
                  }
                  val tab = currentTab()"""
          # Keep Kotlin indentation explicit rather than trusting dedent.
          new = new.replace("                  ", "        ")
          if src.count(old) != 1:
              raise RuntimeError("Unexpected navigate() source; abort patch")
          src = src.replace(old, new)
          callback = """    override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
              super.onActivityResult(requestCode, resultCode, data)
              if (requestCode == 729 && resultCode == Activity.RESULT_OK) {
                  data?.getStringExtra("open_url")?.let { navigate(it) }
              }
          }

          """.replace("              ", "        ")
          insertion = "    override fun onDestroy() {"
          if src.count(insertion) != 1:
              raise RuntimeError("Unexpected MainActivity structure")
          src = src.replace(insertion, callback + insertion)
          src = src.replace("CHEEMS  ·  V0.1", "CHEEMS  ·  V0.2")
          activity.write_text(src, encoding="utf-8")

          source = Path("android/CheemsSearchActivity.kt")
          destination = activity.with_name("CheemsSearchActivity.kt")
          destination.write_text(source.read_text(encoding="utf-8"), encoding="utf-8")

          manifest = root / "app/src/main/AndroidManifest.xml"
          xml = manifest.read_text(encoding="utf-8")
          old_tag = '        <activity\n            android:name=".MainActivity"'
          new_tag = '        <activity android:name=".CheemsSearchActivity" android:exported="false" />\n' + old_tag
          if xml.count(old_tag) != 1:
              raise RuntimeError("Cannot inject search activity manifest")
          manifest.write_text(xml.replace(old_tag, new_tag), encoding="utf-8")

          app_gradle = root / "app/build.gradle.kts"
          gradle = app_gradle.read_text(encoding="utf-8")
          if 'versionCode = 1' not in gradle or 'versionName = "0.1.0"' not in gradle:
              raise RuntimeError("Unexpected app version")
          gradle = gradle.replace('versionCode = 1', 'versionCode = 2')
          gradle = gradle.replace('versionName = "0.1.0"', 'versionName = "0.2.0"')
          app_gradle.write_text(gradle, encoding="utf-8")
          PY

      - name: Fix blank pages and renderer recovery (V0.2.1)
        run: python3 tools/fix_white_screen.py

      - name: Prevent about blank tab and page (V0.2.2)
        run: python3 tools/fix_about_blank.py

      - name: Test Cheems Search frontend
        run: python3 -m unittest discover -s search/web -p 'test_*.py' -v

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android API 37
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Package ARM64 APK only (smaller Android phone download)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("source/CheemsGeckoBrowser/app/build.gradle.kts")
          src=p.read_text(encoding="utf-8")
          if 'abiFilters' in src:
              raise RuntimeError("ABI settings already present; review build manually")
          src += """
          android {
              defaultConfig {
                  ndk {
                      abiFilters.add("arm64-v8a")
                  }
              }
          }
          """
          p.write_text(src, encoding="utf-8")
          PY

      - name: Build APK
        run: gradle -p source/CheemsGeckoBrowser :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CheemsBrowser-V0.2.2-ARM64-APK
          path: source/CheemsGeckoBrowser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
