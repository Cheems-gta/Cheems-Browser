name: Build Cheems Browser APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q CheemsGeckoBrowser_V0.1_Source.zip -d source

      - name: Repair Gradle and Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail
          ROOT=source/CheemsGeckoBrowser
          sed -i 's/version "8.10.0"/version "9.1.1"/' "$ROOT/build.gradle.kts"
          sed -i 's/version "2.2.20"/version "2.4.20"/' "$ROOT/build.gradle.kts"
          sed -i 's/compileSdk = 35/compileSdk = 37/' "$ROOT/app/build.gradle.kts"
          sed -i '/kotlinOptions { jvmTarget = "17" }/d' "$ROOT/app/build.gradle.kts"
          printf '\nkotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }\n' >> "$ROOT/app/build.gradle.kts"
          printf '\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' >> "$ROOT/gradle.properties"
          grep -q 'version "9.1.1"' "$ROOT/build.gradle.kts"
          grep -q 'version "2.4.20"' "$ROOT/build.gradle.kts"
          grep -q 'compileSdk = 37' "$ROOT/app/build.gradle.kts"

      - name: Fix ColorStateList Kotlin type mismatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/CheemsGeckoBrowser/app/src/main/java/io/cheems/browser/MainActivity.kt")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          line_number = 177
          original = lines[line_number - 1]
          print(f"Inspecting MainActivity.kt:{line_number}: {original.rstrip()}")
          match = re.fullmatch(r"(\s*[\w.]*TintList\s*=\s*)(.*?)(\r?\n)?", original)
          if match is None:
              raise RuntimeError("Unexpected Kotlin statement at line 177; refusing unsafe rewrite")
          expression = match.group(2).strip()
          if not expression or "ColorStateList.valueOf" in expression:
              raise RuntimeError("Unexpected tint expression; refusing unsafe rewrite")
          lines[line_number - 1] = (
              match.group(1) + "android.content.res.ColorStateList.valueOf("
              + expression + ")" + (match.group(3) or "")
          )
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android API 37
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle -p source/CheemsGeckoBrowser :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CheemsBrowser-Debug-APK
          path: source/CheemsGeckoBrowser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
