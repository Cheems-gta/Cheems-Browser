name: Build Cheems Browser APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android API 37
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests and emulator APK
        run: gradle -p browser :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PtargetAbi=x86_64 --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android browser regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            gradle -p browser :app:connectedDebugAndroidTest -PtargetAbi=x86_64 --no-daemon; result=$?; mkdir -p verification; adb logcat -d > verification/logcat.txt; adb pull /sdcard/Android/data/io.cheems.browser/files verification/screenshots || true; exit "$result"
      - name: Build phone APK from the same checked-in source
        run: gradle -p browser :app:assembleDebug -PtargetAbi=arm64-v8a --no-daemon
      - name: Verify APK and record source revision
        run: |
          mkdir -p release
          cp browser/app/build/outputs/apk/debug/app-debug.apk release/CheemsBrowser-v0.2.7-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/*.apk > release/apk-info.txt
          grep -q "versionCode='9'" release/apk-info.txt
          grep -q "versionName='0.2.7'" release/apk-info.txt
          grep -q "native-code: 'arm64-v8a'" release/apk-info.txt
          python3 tools/verify_apk.py release/CheemsBrowser-v0.2.7-arm64.apk
          git rev-parse HEAD > release/source-commit.txt
          cd release
          sha256sum CheemsBrowser-v0.2.7-arm64.apk > SHA256SUMS.txt
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: CheemsBrowser-v0.2.7-arm64
          path: release/
          if-no-files-found: error
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            browser/app/build/reports/
            browser/app/build/outputs/androidTest-results/
            verification/
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CheemsBrowser-v0.2.7-arm64
          path: release
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat release/source-commit.txt)" = "$GITHUB_SHA"
          cd release
          sha256sum -c SHA256SUMS.txt
          cd ..
          if gh release view v0.2.7 >/dev/null 2>&1; then
            echo 'Release v0.2.7 already exists; refusing to overwrite a published APK.' >&2
            exit 1
          fi
          gh release create v0.2.7 release/* --target "$GITHUB_SHA" \
            --title 'Cheems Browser v0.2.7 — 搜索与新标签修复' \
            --notes-file docs/release-v0.2.7.md --prerelease
