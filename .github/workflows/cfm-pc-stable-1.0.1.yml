name: Publish tested CFM PC V1.0.1 stable
on:
  push:
    branches: [cfm-pc-web-v1.0.1-fixes]
    paths: [".github/workflows/cfm-pc-stable-1.0.1.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify tested repair assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download cfm-pc-v1.0.1-rc1 --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          echo 'ff8635a5931a280c0e42f417aeb9257ae34c9b879160768a7169eb8654d0c46b  CheemsFileManagerPC_V1.0.1_win-x64.exe' | sha256sum --check
          echo 'cf8a0bad1ef548680d891de758fc0f9f030a6e613941a3cedc508b97b9e9a415  CheemsFileManager-PC-V1.0.1-win-x64.zip' | sha256sum --check
      - name: Publish stable release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Cheems File Manager PC V1.0.1 · Windows x64

          修复跨盘文件夹移动、回收与恢复；增加同名处理策略和批量失败明细；文本原子保存；工具栏自适应布局。保留双栏、多选等原有功能。
          
          38 项 Windows 文件系统测试、15 项交互测试、3 种 Edge 布局检查通过。5 项系统交互仍需实机验证。未增加代码签名、大目录虚拟滚动或自动备份清理。
          
          文件夹覆盖会替换整个目标项目，不是合并；默认保留两份。
          本次正式发布使用已经测试的修复候选版原始二进制，SHA-256 验证一致。
          NOTES
          gh release create cfm-pc-v1.0.1 release/* --repo "$GITHUB_REPOSITORY" --target 6d3ace74857238d13bb9905e39a887b3c4c7871d --title "Cheems File Manager PC V1.0.1 · Windows x64" --notes-file notes.md --latest
