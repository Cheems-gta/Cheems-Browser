name: cheems-search
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Copy .env.example to .env and set a random secret}
      - SEARXNG_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8088/api/}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    networks:
      - internal

  cheems:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - searxng
    networks:
      - internal

networks:
  internal:
volumes:
  searxng-cache:
