use_default_settings: true

general:
  instance_name: "Cheems Search"
  debug: false

search:
  safe_search: 2
  default_lang: "all"
  formats:
    - html
    - json

server:
  # Overwritten by the SEARXNG_SECRET environment variable from .env
  secret_key: "SET_A_RANDOM_KEY_IN_DOT_ENV"
  limiter: false
  image_proxy: true
