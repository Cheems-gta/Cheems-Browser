# Open-source SearXNG configuration for Cheems Search.
# Do not embed production secrets in this file.
use_default_settings: true
general:
  debug: false
  instance_name: "Cheems Search"
search:
  safe_search: 1
  formats:
    - html
    - json
server:
  limiter: true
  image_proxy: true
valkey:
  url: valkey://valkey:6379/0
