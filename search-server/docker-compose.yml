# Cheems Search: self-hosted SearXNG backend.
# Put behind an HTTPS reverse proxy before connecting the Android app.
name: cheems-search
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET before startup}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:?Set HTTPS public URL}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./core-config:/etc/searxng:ro
      - search-cache:/var/cache/searxng
    depends_on:
      - valkey
  valkey:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
    volumes:
      - valkey-data:/data
volumes:
  search-cache:
  valkey-data:
