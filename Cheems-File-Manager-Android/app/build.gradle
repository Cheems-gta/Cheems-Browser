plugins {
    id 'com.android.application'
}
android {
    namespace 'win.cheems.filemanager'
    compileSdk 35
    defaultConfig {
        // Different application ID: doesn't overwrite the native Android CFM app.
        applicationId 'win.cheems.filemanager.pcpreview'
        minSdk 30
        targetSdk 35
        versionCode 6
        versionName '0.6.0-PC-Preview'
    }
    buildFeatures {
        aidl true
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.junrar:junrar:8.1.2'
    // The original native Android MainActivity remains in source but is not launched.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
